name: PHP MySQL Connection Test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli

    - name: Test database connection
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        # First test connection with inline PHP
        php <<<'EOF'
        <?php
        try {
            $conn = new mysqli(
                getenv("DB_HOST"),
                getenv("DB_USER"),
                getenv("DB_PASS"),
                getenv("DB_NAME")
            );
            
            if ($conn->connect_error) {
                throw new Exception("Connection failed: " . $conn->connect_error);
            }
            echo "✅ Successfully connected to MySQL server!\n";
            echo "MySQL version: " . $conn->server_version . "\n";
            
            // Test query
            $result = $conn->query("SHOW TABLES");
            echo "Tables in database:\n";
            while ($row = $result->fetch_array()) {
                echo "- " . $row[0] . "\n";
            }
            
            $conn->close();
        } catch (Exception $e) {
            file_put_contents("php://stderr", "❌ ERROR: " . $e->getMessage() . "\n");
            exit(1);
        }
        EOF
        
        # Then run your actual script
        php db.php
