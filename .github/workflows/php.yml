name: MySQL Connection Test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli

    - name: Test MySQL Connection
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        # 1. Verify DNS resolution
        echo "🔍 Resolving $DB_HOST..."
        host $DB_HOST || true
        
        # 2. Test basic connectivity
        echo "🔌 Testing connection to $DB_HOST:3306..."
        timeout 5 bash -c "cat < /dev/null > /dev/tcp/$DB_HOST/3306" && \
          echo "✅ Port 3306 is open" || \
          echo "❌ Could not connect to port 3306"
        
        # 3. Advanced connection test
        php <<"ENDOFPHP"
        <?php
        \$start = microtime(true);
        \$host = getenv('DB_HOST');
        
        echo "⌛ Attempting to connect to MySQL at {\$host}...\n";
        
        try {
            \$conn = new mysqli(
                \$host,
                getenv('DB_USER'),
                getenv('DB_PASS'),
                getenv('DB_NAME'),
                3306, // Port
                10    // Timeout (seconds)
            );
            
            if (\$conn->connect_error) {
                throw new Exception("Connection failed after " . 
                    round(microtime(true)-\$start, 2) . "s: " . \$conn->connect_error);
            }
            
            echo "✅ Connected to MySQL " . \$conn->server_version . " in " . 
                round(microtime(true)-\$start, 2) . "s\n";
            
            \$conn->close();
        } catch (Exception \$e) {
            file_put_contents('php://stderr', "❌ ERROR: " . \$e->getMessage() . "\n");
            
            // Additional diagnostics
            \$error = error_get_last();
            if (\$error) {
                file_put_contents('php://stderr', "Last PHP error: " . print_r(\$error, true) . "\n");
            }
            
            exit(1);
        }
        ENDOFPHP
