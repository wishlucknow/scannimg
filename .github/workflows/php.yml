name: Execute PHP and Python Scripts

on: [push, workflow_dispatch]

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Debug: Show directory structure
    - name: List files
      run: ls -R
    
    # PHP execution with correct path
    - name: Run PHP script
      run: |
        echo "Running PHP script..."
        php scripts/your-php-script.php  # Updated path
        
    # Python setup and execution
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
    
    - name: Run Python script
      run: |
        python scripts/your-python-script.py  # Updated path
