name: MySQL Connection Test

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql

    - name: Full Network Diagnostics
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
      run: |
        echo "🔍 Network Diagnostics Report"
        echo "==========================="
        
        # 1. Verify DNS
        echo -e "\n1. DNS Resolution:"
        host "$DB_HOST" || echo "DNS lookup failed"
        
        # 2. Test basic connectivity
        echo -e "\n2. TCP Connection Test:"
        timeout 5 bash -c "echo > /dev/tcp/$DB_HOST/3306" 2>/dev/null && \
          echo "✅ Port 3306 is accessible" || \
          echo "❌ Cannot reach port 3306"
        
        # 3. Traceroute if available
        echo -e "\n3. Route Tracing:"
        which traceroute && traceroute -w 1 -m 5 "$DB_HOST" || echo "Traceroute not available"
        
        # 4. MySQL client test
        echo -e "\n4. Raw MySQL Client Test:"
        which mysql && \
          timeout 5 mysql -h"$DB_HOST" -u"${{ secrets.DB_USER }}" -p"${{ secrets.DB_PASS }}" -e "SELECT 1" 2>&1 | grep -v "Using a password" || \
          echo "MySQL client test failed"

    - name: Advanced PHP Connection Test
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        cat > connection_test.php <<'EOF'
        <?php
        // Enhanced connection tester
        $host = getenv('DB_HOST');
        $user = getenv('DB_USER');
        $pass = getenv('DB_PASS');
        $db   = getenv('DB_NAME');
        
        function test_connection($type, $callback) {
            echo "\n🔧 Testing $type connection...\n";
            try {
                $start = microtime(true);
                $conn = $callback();
                $time = round(microtime(true)-$start, 3);
                
                if (is_object($conn) && method_exists($conn, 'close')) {
                    $conn->close();
                }
                echo "✅ $type connected in {$time}s\n";
                return true;
            } catch (Exception $e) {
                echo "❌ $type failed: " . $e->getMessage() . "\n";
                return false;
            }
        }
        
        // Test multiple connection methods
        $methods = [
            'mysqli (standard)' => fn() => new mysqli($host, $user, $pass, $db),
            'mysqli (with port)' => fn() => new mysqli($host, $user, $pass, $db, 3306),
            'PDO' => fn() => new PDO(
                "mysql:host=$host;dbname=$db",
                $user,
                $pass,
                [PDO::ATTR_TIMEOUT => 5, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
            )
        ];
        
        $success = false;
        foreach ($methods as $name => $method) {
            if (test_connection($name, $method)) {
                $success = true;
                break;
            }
        }
        
        if (!$success) {
            echo "\n💡 Troubleshooting Tips:\n";
            echo "1. Verify MySQL server is running and accessible\n";
            echo "2. Check if port 3306 is open in firewall/security groups\n";
            echo "3. Confirm user has remote access privileges\n";
            echo "4. Try using IP address instead of hostname\n";
            echo "5. Contact your hosting provider about MySQL remote access\n";
            exit(1);
        }
        EOF
        
        php connection_test.php
