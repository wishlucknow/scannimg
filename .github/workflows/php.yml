name: Hostinger MySQL Debugger

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql

    - name: Hostinger Network Scan
      run: |
        echo "🔍 Deep Scanning srv658.hstgr.io..."
        echo "1. DNS Records:"
        host srv658.hstgr.io
        echo -e "\n2. Port Scan (3306-3309):"
        for port in {3306..3309}; do
          timeout 2 bash -c "echo > /dev/tcp/srv658.hstgr.io/$port" 2>/dev/null && \
            echo "✅ Port $port open" || \
            echo "❌ Port $port closed"
        done
        echo -e "\n3. Traceroute:"
        traceroute -w 1 -m 5 srv658.hstgr.io 2>/dev/null || echo "Traceroute blocked"

    - name: Hostinger Connection Test
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_HOST: srv658.hstgr.io
      run: |
        php -r '
        $host = getenv("DB_HOST");
        $user = getenv("DB_USER");
        $pass = getenv("DB_PASS");
        $db   = getenv("DB_NAME");

        try {
            $conn = new mysqli($host, $user, $pass, $db);
            if ($conn->connect_error) {
                throw new Exception($conn->connect_error);
            }
            echo "✅ Connection successful\n";
            $conn->close();
        } catch (Exception $e) {
            echo "❌ Connection failed: " . $e->getMessage() . "\n";
        }
        '

    - name: Run index.php
      run: |
        php index.php
